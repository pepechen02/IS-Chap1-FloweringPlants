<head>

<title>Flowering Plants Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Layout: one centred column styled like a botanist field notebook. Squared-paper masthead, white answer cards, pollen-gold progress. */
  :root{
    --bg:#EEF3E6;
    --card:#FFFFFF;
    --ink:#1D3324;
    --muted:#587061;
    --line:#D3DEC8;
    --soft:#E2EBD7;
    --accent:#F4B82E;
    --accent-ink:#1D3324;
    --accent-soft:#FFF0C2;
    --accent-text:#7A5600;
    --primary:#2C7A4F;
    --primary-ink:#FFFFFF;
    --primary-soft:#DDF0E2;
    --good:#1A7F4B;
    --good-soft:#DDF3E3;
    --bad:#C0463E;
    --bad-soft:#FBE5E2;
    --part:#7A5600;
    --part-soft:#FFF0C2;
    --grid:rgba(44,122,79,.13);
    --petal:#E4685D;
    --leaf:#5FA464;
    --stigma:#E87A55;
    --f-display:'Bricolage Grotesque','Noto Sans TC',system-ui,sans-serif;
    --f-body:'Figtree','Noto Sans TC',system-ui,-apple-system,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
    --bg:#0E1A12;
    --card:#16261C;
    --ink:#E8F2E9;
    --muted:#9DB5A3;
    --line:#2A4032;
    --soft:#1F3326;
    --accent:#FFC947;
    --accent-ink:#1D3324;
    --accent-soft:#3A3010;
    --accent-text:#FFDB7A;
    --primary:#7FD39A;
    --primary-ink:#0E1A12;
    --primary-soft:#1B3F2A;
    --good:#5BDB92;
    --good-soft:#143826;
    --bad:#FF9088;
    --bad-soft:#40201D;
    --part:#FFDB7A;
    --part-soft:#3A3010;
    --grid:rgba(127,211,154,.14);
    --petal:#FF8F84;
    --leaf:#7CCB82;
    --stigma:#FF9A78;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1A12;
    --card:#16261C;
    --ink:#E8F2E9;
    --muted:#9DB5A3;
    --line:#2A4032;
    --soft:#1F3326;
    --accent:#FFC947;
    --accent-ink:#1D3324;
    --accent-soft:#3A3010;
    --accent-text:#FFDB7A;
    --primary:#7FD39A;
    --primary-ink:#0E1A12;
    --primary-soft:#1B3F2A;
    --good:#5BDB92;
    --good-soft:#143826;
    --bad:#FF9088;
    --bad-soft:#40201D;
    --part:#FFDB7A;
    --part-soft:#3A3010;
    --grid:rgba(127,211,154,.14);
    --petal:#FF8F84;
    --leaf:#7CCB82;
    --stigma:#FF9A78;
    color-scheme:dark;
  }

  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
       padding-block:0 40px;-webkit-text-size-adjust:100%}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
  #root{max-width:760px;margin:0 auto}
  button{font-family:inherit;cursor:pointer}
  button:disabled{cursor:not-allowed}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .rise{animation:rise .22s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .bob{animation:bob 2.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.rise,.bob{animation:none}*{transition:none!important}}

  /* squared lab-notebook masthead */
  .blueprint{background-color:var(--card);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px}
  .diagbox{width:100%;max-width:250px;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:8px}
  .flower-diagram{display:block;width:100%;height:auto}
  /* flower diagram parts */
  .sepal-shape{fill:var(--leaf);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
  .petal-shape{fill:var(--petal);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;opacity:.9}
  .filament-line{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
  .anther-shape{fill:var(--accent);stroke:var(--ink);stroke-width:2.5}
  .style-shape{fill:var(--leaf);stroke:var(--ink);stroke-width:2}
  .stigma-shape{fill:var(--stigma);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
  .ovary-shape{fill:var(--leaf);stroke:var(--ink);stroke-width:2.5}
  .ovule-shape{fill:var(--ink);opacity:.7}
  .group-hl{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-dasharray:6 5;animation:dash 6s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-100}}
  .is-hl{filter:drop-shadow(0 0 7px var(--accent)) drop-shadow(0 0 2px var(--accent));animation:pulse 1.1s ease-in-out infinite}
  .filament-line.is-hl{stroke:var(--accent)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){.is-hl,.group-hl{animation:none}}

</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ===== DATA (from the original quiz bank) ===== */
var Q = {};

  Q.A1 = [
    {q:"What does 'pollination' mean?",
     opts:["The transfer of pollen from the anther to the stigma of the same or a different flower","The process in which the pollen and the egg join","The development of a plant from a seed","The scattering of seeds away from the parent plant"],
     a:0, ex:"「pollination（授粉）」是指花粉從花藥（anther）傳到柱頭（stigma）的過程，可能是同一朵花或不同朵花之間。b是受精（fertilisation），c是發芽（germination），d是種子傳播（seed dispersal）。"},
    {q:"Which term means 'the process in which the pollen and the egg join'?",
     opts:["pollination","fertilisation","germination","seed dispersal"],
     a:1, ex:"花粉與卵結合的過程稱為「fertilisation（受精）」，發生在授粉之後、子房內部。"},
    {q:"What is 'germination'?",
     opts:["The development of a plant from a seed","The transfer of pollen between flowers","The stages of growth in a living thing's life","A measure of how hot or cold something is"],
     a:0, ex:"「germination（發芽）」是指種子發育成幼苗的過程，需要空氣、水和合適的溫度。"},
    {q:"Plants that bear flowers are called ___.",
     opts:["non-flowering plants","flowering plants","seedlings","carpels"],
     a:1, ex:"會開花的植物稱為「flowering plants（開花植物）」，例如玫瑰和雛菊；蕨類和針葉樹則是不開花植物（non-flowering plants）。"},
    {q:"What do we call 'the stages of growth and development in the life of a living thing'?",
     opts:["germination","pollination","life cycle","fertilisation"],
     a:2, ex:"生物從出生到死亡所經歷的各個成長階段，合稱為「life cycle（生命週期）」。"},
    {q:"Which term describes 'the scattering of seeds away from the parent plant'?",
     opts:["germination","seed dispersal","pollination","fertilisation"],
     a:1, ex:"種子離開母株、散布到別處的過程叫「seed dispersal（種子傳播）」，可避免種子和母株互相競爭水分、陽光和空間。"},
    {q:"What is the function of 'petals'?",
     opts:["They contain pollen grains","They usually have bright colours and attract insects","They develop into fruit","They measure temperature"],
     a:1, ex:"花瓣（petals）通常顏色鮮豔，用來吸引昆蟲，幫助昆蟲把花粉從雄蕊傳到雌蕊。"},
    {q:"The 'ovary' is best described as ___.",
     opts:["the male part of a flower that contains pollen grains","the female part of a flower that contains ovules","the part of a flower where pollen lands","parts of a flower that usually have bright colours"],
     a:1, ex:"子房（ovary）是花的雌性部位，裡面含有胚珠（ovule），每個胚珠內有一個卵。"},
    {q:"Which term means 'a measure of how hot or cold something is'?",
     opts:["germination","temperature","life cycle","fertilisation"],
     a:1, ex:"「temperature（溫度）」是用來衡量冷熱程度的量，種子發芽需要合適的溫度。"},
    {q:"What are 'seeds'?",
     opts:["Small, hard parts of a plant from which new plants grow","Parts of a flower that contain the male parts","The stages of growth in a living thing","Plants that do not bear flowers"],
     a:0, ex:"種子（seeds）是植物的小而堅硬的部位，新植物會從種子長出來。"},
    {q:"What is the 'stamen'?",
     opts:["The part of a flower that contains the male parts","The part of a flower that contains the female parts","The female part where pollen is received","Parts of a flower with bright colours"],
     a:0, ex:"雄蕊（stamen）是花中含有雄性部位（花藥和花絲）的構造。"},
    {q:"What is the 'carpel'?",
     opts:["The part of a flower that contains the female parts","The part of a flower that contains the male parts","The male part that contains pollen grains","A measure of temperature"],
     a:0, ex:"雌蕊（carpel）是花中含有雌性部位（柱頭、花柱、子房）的構造。"},
    {q:"The 'anther' contains ___.",
     opts:["ovules","pollen grains","an egg","water"],
     a:1, ex:"花藥（anther）裡面裝著花粉（pollen），花粉由許多細小的粉末狀顆粒組成。"},
    {q:"The 'stigma' is best described as ___.",
     opts:["the part that pollen grains land on","the part that contains pollen grains","the part that develops into a fruit","the part that measures temperature"],
     a:0, ex:"柱頭（stigma）是花粉粒降落、附著的地方，是授粉的第一步。"},
    {q:"Plants that do NOT produce flowers, such as ferns and conifers, are called ___.",
     opts:["flowering plants","non-flowering plants","seedlings","carpels"],
     a:1, ex:"蕨類和針葉樹不會開花，因此被歸類為「non-flowering plants（不開花植物）」。"}
  ];

  Q.A2 = [
    {q:"What are 'flowers'?",
     opts:["Parts of a flowering plant that help it reproduce","The leaf-like parts that protect a bud","Small hard parts from which new plants grow","The male parts of a plant only"],
     a:0, ex:"花（flowers）是開花植物用來繁殖（生殖）的構造，內含雄蕊和雌蕊。"},
    {q:"Look at the diagram. The glowing part is where pollen grains land. What is it called?",
     opts:["stigma","anther","ovary","sepal"], diagram:"stigma",
     a:0, ex:"圖中發光標示的位置是柱頭（stigma），是花粉粒降落的地方，也是授粉的起點。"},
    {q:"Which part is glowing below? It contains the pollen grains.",
     opts:["stigma","anther","filament","ovule"], diagram:"anther",
     a:1, ex:"標示處是花藥（anther），裡面裝著花粉。花藥通常長在花絲（filament）的頂端。"},
    {q:"The glowing thin stalk holds up the anther. What is this part called?",
     opts:["style","filament","sepal","petal"], diagram:"filament",
     a:1, ex:"支撐花藥、細細長長的部分叫做花絲（filament），花絲加上花藥合稱雄蕊（stamen）。"},
    {q:"This glowing bulb-shaped part contains one or more ovules. What is it?",
     opts:["ovary","anther","stigma","sepal"], diagram:"ovary",
     a:0, ex:"標示的膨大部位是子房（ovary），裡面含有一個或多個胚珠（ovule）。"},
    {q:"Zoom in — the tiny glowing dot inside the ovary contains an egg. What is it?",
     opts:["ovule","stigma","filament","petal"], diagram:"ovule",
     a:0, ex:"子房裡面的小小構造叫做胚珠（ovule），每個胚珠裡都含有一個卵細胞。"},
    {q:"The glowing tube connects the stigma to the ovary. What is this called?",
     opts:["filament","style","stamen","sepal"], diagram:"style",
     a:1, ex:"連接柱頭和子房的細長管狀構造叫做花柱（style），花粉管會沿著花柱往下生長到子房。"},
    {q:"The glowing leaf-like parts at the very base of the flower are known as ___.",
     opts:["petals","sepals","stamens","carpels"], diagram:"sepal",
     a:1, ex:"位於花的最外圍基部、形狀像小葉子的構造叫做萼片（sepal），通常在花苞未開放前包覆並保護花苞。"},
    {q:"The glowing colourful part surrounding the flower's male and female parts is called ___.",
     opts:["sepal","petal","stigma","ovary"], diagram:"petal",
     a:1, ex:"包圍著花的雄性與雌性部位、顏色通常很鮮豔的構造是花瓣（petal），可以吸引昆蟲前來傳粉。"},
    {q:"The glowing group of parts (the anther and its filament together) is called the ___.",
     opts:["stamen","carpel","sepal","ovary"], diagram:"stamen_group",
     a:0, ex:"花藥加上花絲合稱為雄蕊（stamen），是花的雄性生殖構造。"},
    {q:"The glowing group of parts (stigma, style and ovary together) is called the ___.",
     opts:["stamen","carpel","sepal","petal"], diagram:"carpel_group",
     a:1, ex:"柱頭、花柱和子房合在一起稱為雌蕊（carpel），是花的雌性生殖構造。"},
    {q:"Rose and daisy are examples of ___.",
     opts:["flowering plants","non-flowering plants","seedlings","carpels"],
     a:0, ex:"玫瑰（rose）和雛菊（daisy）都會開花，屬於開花植物（flowering plants）。"},
    {q:"Insects, birds and wind help transfer pollen from one flower to another. This process is known as ___.",
     opts:["germination","pollination","fertilisation","seed dispersal"],
     a:1, ex:"昆蟲、鳥類和風幫忙把花粉從一朵花傳到另一朵花的過程稱為授粉（pollination）。"},
    {q:"True or False: Scientists use a model of a flower because real flowers can look very different, and a model shows their common important features.",
     opts:["True","False"],
     a:0, ex:"因為不同種類的花外觀差異很大，科學家用「模型」（model）來呈現花的共同重要特徵，幫助我們理解花的構造。"},
    {q:"What do the anther and stigma have in common?",
     opts:["They are both parts of the stamen","They are both directly involved in pollination (pollen moves from anther to stigma)","They both contain ovules","They are both leaf-like structures"],
     a:1, ex:"花藥（anther）產生並釋放花粉，柱頭（stigma）接收花粉，兩者都與授粉過程直接相關。"}
  ];

  Q.B1 = [
    {q:"According to the text, ferns and conifers are examples of ___ plants.",
     opts:["flowering","non-flowering","seed-dispersing","germinating"],
     a:1, ex:"蕨類（ferns）與針葉樹（conifers）都不開花，屬於不開花植物（non-flowering plants）。"},
    {q:"What are flowers, according to the text?",
     opts:["The reproductive parts of a plant","The roots that absorb water","The green parts that make food","The parts that store seeds only"],
     a:0, ex:"課文提到花是植物的生殖構造（reproductive parts），幫助植物繁殖。"},
    {q:"The petals of a flower surround ___.",
     opts:["its male and female parts","only its roots","only its stem","the soil around the plant"],

    {q:"Match the function: 'the part where pollen grains land' belongs to which part?",
     opts:["anther","stigma","ovary","sepal"],

    {q:"Match the function: 'contains one or more ovules' belongs to which part?",

    {q:"In the life cycle diagram, what typically happens right after the 'seed' stage?",
     opts:["It becomes a seedling","It becomes an adult plant immediately","It disperses pollen","It undergoes fertilisation"],
     a:0, ex:"種子吸收水分後開始發芽，長成幼苗（seedling），這是生命週期中接在「種子」之後的階段。"},
    {q:"Why do scientists use diagrams (like the life cycle circle) to represent scientific ideas?",
     opts:["To make plants grow faster","To represent certain scientific ideas clearly and show repeating stages","To replace the need for real observation","To decorate science textbooks"],
     a:1, ex:"科學家使用圖表（如生命週期圖）來清楚呈現科學概念，例如展示一個會不斷重複的循環過程。"},
    {q:"What is pollination?",

  ];

  Q.B2 = [
    {q:"After fertilisation, what happens to the petals and stamen?",
     opts:["They wither and fall off","They grow bigger and brighter","They turn into seeds directly","They become the new fruit"],
     a:0, ex:"受精後，花瓣和雄蕊會逐漸凋謝、脫落，養分轉而供給子房發育。"},
    {q:"What does the ovary develop into after fertilisation?",
     opts:["A fruit, while the ovules develop into seeds","A new flower","A root","A leaf"],
     a:0, ex:"受精後子房會膨大發育成果實，而胚珠則發育成種子（例如番茄的例子）。"},

function Quiz({session, onHome, onRecord, onFinish, onNotes}) {
  const { parts, title } = session;
  const flat = useMemo(() => parts.flatMap(p => p.qs.map(q => ({q, sec:p.sec}))), [parts]);
  const [idx, setIdx] = useState(0);
  const [st, setSt] = useState({});
  const [fin, setFin] = useState(false);
  const [leaving, setLeaving] = useState(false);
  const nextRef = useRef(null);

  const total = ptsOf(flat.map(x => x.q));
  const score = flat.reduce((a,x) => a + ((st[x.q.id] && st[x.q.id].pts) || 0), 0);
  const answered = flat.filter(x => st[x.q.id] && st[x.q.id].checked).length;
  const cur = flat[idx]; const q = cur.q, sec = cur.sec, s = st[q.id] || {};

  const patch = (id,o) => setSt(prev => ({...prev, [id]: {...(prev[id]||{}), ...o}}));
  const pickMC = i => {
    if(s.checked) return;
    const status = i===q.ans ? 'right' : 'wrong';
    patch(q.id, {checked:true, status, pts: status==='right' ? q.pts : 0, value:q.options[i], pick:i});
    onRecord(q, status, q.options[i]);
  };
  const next = () => { if(idx < flat.length-1) setIdx(idx+1); else { setFin(true); onFinish(session.key, score, total); } };

  useEffect(() => { try { window.scrollTo({top:0}); } catch(e){} }, [idx, fin]);
  useEffect(() => {
    if(!s.checked) return;
    const t = setTimeout(() => { try { nextRef.current && nextRef.current.focus({preventScroll:true}); } catch(e){} }, 150);
    return () => clearTimeout(t);
  }, [s.checked, idx]);

  if(fin) {
    const g = CFG.gradeOf(score,total);
    const pct = Math.round(score/total*100);
    const wrong = flat.filter(x => st[x.q.id] && st[x.q.id].status !== 'right');
    return (
      <div className="rise pb-10 pt-6">
        <div className="blueprint rounded-3xl border border-line p-6 text-center">
          <Chip className="bg-primarysoft text-primary">{title}</Chip>
          <div className="mt-4 font-display text-7xl font-extrabold leading-none">{score}<span className="text-3xl text-muted"> / {total}</span></div>
          <div className="mt-2 text-lg text-muted">{pct}%</div>
          <div className="mx-auto mt-5 inline-flex items-center gap-3 rounded-2xl bg-accent px-5 py-3 text-accentink">
            <span className="font-display text-3xl font-extrabold">{g.k}</span>
            <span className="text-left leading-tight"><span className="block font-display text-lg font-extrabold">{g.name}</span><span className="text-sm font-medium">{g.zh}</span></span>
          </div>
          <p className="mx-auto mt-4 max-w-md text-ink">{g.msg}</p>
          <div className="mx-auto mt-5 max-w-xl overflow-x-auto"><div className="grid grid-cols-5 gap-1 text-center font-mono text-[11px] text-muted" style={{minWidth:'420px'}}>
            {[['100%',score===total],['99-90%',pct>=90&&score<total],['89-80%',pct>=80&&pct<90],['79-70%',pct>=70&&pct<80],['Below 69%',pct<70]].map(([l,on]) =>
              <div key={l} className={'rounded-lg border px-1 py-1.5 ' + (on ? 'border-accent bg-accentsoft font-bold text-accenttext' : 'border-line bg-card')}>{l}</div>)}
          </div></div>
        </div>

        <div className="mt-5 rounded-2xl border border-line bg-card p-5">
          <h2 className="font-display text-lg font-extrabold">各單元得分</h2>
          <div className="mt-3 flex flex-col gap-3">
            {parts.map(p => {
              const got = p.qs.reduce((a,q) => a + ((st[q.id]&&st[q.id].pts)||0), 0), tot = ptsOf(p.qs);
              return (<div key={p.sec.id}>
                <div className="mb-1 flex items-baseline justify-between gap-3 text-sm">
                  <span className="min-w-0 truncate"><b>{p.sec.code}</b> <span className="text-muted">{p.sec.zh}</span></span>
                  <span className="font-mono font-semibold">{got}/{tot}</span>
                </div>
                <div className="h-2.5 overflow-hidden rounded-full bg-soft"><div className="h-full rounded-full bg-accent" style={{width:(got/tot*100)+'%'}}/></div>
              </div>);
            })}
          </div>
        </div>

        <div className="mt-6 flex flex-col gap-3 sm:flex-row">
          <Btn kind="accent" className="flex-1" onClick={() => session.retry()}>重新挑戰</Btn>
          <Btn kind="ghost" className="flex-1" onClick={onHome}>回首頁選單元</Btn>
          <Btn kind="ghost" className="flex-1" onClick={onNotes}>全部錯題筆記</Btn>
        </div>

        <h2 className="mt-9 font-display text-xl font-extrabold">本次錯題筆記 <span className="text-base font-semibold text-muted">（{wrong.length} 題）</span></h2>
        {wrong.length===0
          ? <p className="mt-3 rounded-2xl border border-good bg-goodsoft p-4 text-good">這次沒有錯題，太厲害了！</p>
          : <div className="mt-3 flex flex-col gap-3">{wrong.map(x => <NoteCard key={x.q.id} q={x.q} sec={x.sec} yours={st[x.q.id].value}/>)}</div>}
      </div>
    );
  }

  return (
    <div className="pb-10">
      <header className="sticky z-20 bg-bg pb-3 pt-3" style={{top:'env(safe-area-inset-top,0px)'}}>
        <div className="flex items-center justify-between gap-3">
          <button onClick={() => setLeaving(true)} className="rounded-lg px-2 py-1 text-sm font-semibold text-muted hover:text-ink">← 離開</button>
          <div className="min-w-0 flex-1 truncate text-center font-display font-extrabold">{title}</div>
          <div className="font-mono text-sm"><b>{score}</b><span className="text-muted">/{total}</span></div>
        </div>
        <div className="mt-3"><SegBar parts={parts} flat={flat} st={st} idx={idx}/></div>
        <div className="mt-1 flex justify-between text-xs text-muted"><span>第 {idx+1} / {flat.length} 題</span><span>已作答 {answered} 題</span></div>
      </header>

      {leaving && (
        <div className="rise mb-3 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-bad bg-badsoft p-3 text-sm">
          <span className="text-ink">確定要離開嗎？目前的作答進度不會保留。</span>
          <span className="flex gap-2"><Btn kind="ghost" className="!px-3 !py-1.5 text-sm" onClick={() => setLeaving(false)}>繼續作答</Btn><Btn className="!px-3 !py-1.5 text-sm" onClick={onHome}>離開</Btn></span>
        </div>
      )}

      <div key={q.id} className="rise rounded-3xl border border-line bg-card p-5 sm:p-7">
        <div className="mb-4 flex flex-wrap items-center gap-2">
          <Chip className="bg-primarysoft text-primary">{sec.code}</Chip>
          <span className="text-sm font-semibold">{sec.zh}</span>
          <span className="text-sm text-muted">· Q{q.no} · {q.pts} 分</span>
          <LvChip lv={q.lv}/>
        </div>
        <p className="mb-4 text-sm italic text-muted">{sec.dir}</p>

        {q.dg && (
          <div className="mb-5 text-center">
            <div className="diagbox mx-auto" dangerouslySetInnerHTML={{__html: renderDiagram(q.dg)}}/>
            <div className="mt-2 font-mono text-xs tracking-wide text-muted">{CFG.diagCaption}</div>
          </div>
        )}

        <p className="text-xl font-medium leading-snug break-words">{q.q}</p>

        <div className="mt-5 flex flex-col gap-2.5">
          {q.options.map((o,i) => {
            const picked = s.pick===i, isAns = i===q.ans;
            let cls = 'border-line bg-card hover:border-primary';
            if(s.checked) cls = isAns ? 'border-good bg-goodsoft' : picked ? 'border-bad bg-badsoft' : 'border-line bg-card opacity-60';
            return (
              <button key={i} onClick={() => pickMC(i)} aria-pressed={picked}
                className={'flex w-full items-start gap-3 rounded-xl border-2 px-4 py-3 text-left transition ' + cls}>
                <span className={'mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full border font-mono text-sm font-semibold ' + (s.checked && isAns ? 'border-good bg-good text-card' : s.checked && picked ? 'border-bad bg-bad text-card' : 'border-line')}>{LETTERS[i]}</span>
                <span className="min-w-0 flex-1 break-words leading-snug">{o}</span>
                {s.checked && isAns && <span className="font-bold text-good">✓</span>}
                {s.checked && picked && !isAns && <span className="font-bold text-bad">✕</span>}
              </button>
            );
          })}
        </div>

        {s.checked && <Feedback q={q} s={s}/>}
      </div>

      <div className="mt-5 flex items-center justify-between gap-3">
        <Btn kind="ghost" onClick={() => setIdx(idx-1)} disabled={idx===0}>← 上一題</Btn>
        {s.checked
          ? <Btn kind="accent" onClick={next} ref={nextRef}>{idx<flat.length-1 ? '下一題 →' : '完成，查看成績'}</Btn>
          : <span className="text-sm text-muted">點選一個選項，馬上看結果</span>}
      </div>
    </div>
  );
}

function UnitCard({sec, best, onStart}) {
  const qs = QS[sec.id], b = best[sec.id];
  const bn = qs.filter(q => q.lv==='b').length;
  return (
    <button onClick={onStart} className="flex flex-col gap-3 rounded-2xl border border-line bg-card p-4 text-left transition hover:border-primary active:scale-[.99]">
      <div className="flex items-center justify-between gap-2">
        <Chip className="bg-primarysoft text-primary">{sec.code}</Chip>
        <span className="text-xs text-muted">{sec.tag}</span>
      </div>
      <div className="flex items-start gap-3">
        <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-primarysoft"><Icon name={sec.icon} size={40}/></div>
        <div className="min-w-0">
          <div className="font-display text-lg font-extrabold leading-snug">{sec.en}</div>
          <div className="text-sm text-muted">{sec.desc}</div>
        </div>
      </div>
      <div className="mt-auto flex items-center justify-between text-sm">
        <span className="text-muted">{qs.length} 題{bn>0 && bn<qs.length ? `（基礎 ${bn}／進階 ${qs.length-bn}）` : ''}</span>
        {b ? <span className="font-semibold text-good">最佳 {b.score}/{b.total}</span> : <span className="text-muted">尚未挑戰</span>}
      </div>
    </button>
  );
}

function FullCard({f, best, onStart}) {
  const qs = f.secs.flatMap(s => QS[s]);
  return (
    <section className="rounded-3xl border-2 border-accent bg-card p-5 sm:p-6">
      <div className="flex flex-wrap items-center justify-between gap-4">
        <div className="min-w-0">
          <Chip className="bg-accentsoft text-accenttext">{f.tag}</Chip>
          <h2 className="mt-2 font-display text-2xl font-extrabold">{f.title}</h2>
          <p className="mt-1 text-sm text-muted">{f.desc} · {qs.length} 題 · 共 {ptsOf(qs)} 分</p>
          {best && <p className="mt-1 text-sm font-semibold text-good">最佳成績 {best.score}/{best.total}</p>}
        </div>
        <Btn kind="accent" onClick={onStart}>開始挑戰</Btn>
      </div>
    </section>
  );
}

function Home({best, noteCount, start, openNotes, practiceNotes, openKey}) {
  return (
    <div className="pb-10 pt-6">
      <div className="blueprint relative overflow-hidden rounded-3xl border border-line p-6 sm:p-8">
        <div className="flex items-start justify-between gap-4">
          <div className="min-w-0">
            <Chip className="bg-primarysoft text-primary">{CFG.hero.chip}</Chip>
            <h1 className="mt-3 font-display text-4xl font-extrabold leading-tight sm:text-5xl" style={{textWrap:'balance'}}>{CFG.hero.title}</h1>
            <p className="mt-2 text-muted">{CFG.hero.sub}</p>
          </div>
          <div className="shrink-0"><Mascot/></div>
        </div>
        <p className="mt-5 max-w-lg text-ink">{CFG.hero.intro}</p>
      </div>

      {CFG.keypoints && (
        <button onClick={openKey} className="mt-6 flex w-full items-center gap-4 rounded-2xl border border-line bg-card p-4 text-left transition hover:border-primary active:scale-[.99]">
          <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-accentsoft"><Icon name="notes" size={40}/></div>
          <div className="min-w-0">
            <Chip className="bg-accentsoft text-accenttext">KEY POINTS</Chip>
            <div className="mt-1 font-display text-lg font-extrabold">重點整理</div>
            <div className="text-sm text-muted">先看課文重點、單字與粒子模型，再做題目</div>
          </div>
        </button>
      )}

      <div className="mt-6 flex flex-col gap-3">
        {FULLS.map(f => <FullCard key={f.key} f={f} best={best[f.key]} onStart={() => start({key:f.key, title:f.title, secs:f.secs})}/>)}
      </div>

      {GROUPS.map(g => (
        <div key={g.tag}>
          <h2 className="mt-8 font-display text-xl font-extrabold">{g.title}</h2>
          <p className="text-sm text-muted">{g.sub}</p>
          <div className="mt-3 grid gap-3 sm:grid-cols-2">
            {g.mods.map(s => <UnitCard key={s} sec={SEC[s]} best={best} onStart={() => start({key:s, title:SEC[s].code + ' ' + SEC[s].en, secs:[s]})}/>)}
          </div>
        </div>
      ))}

      <section className="mt-8 rounded-2xl border border-line bg-card p-5">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 className="font-display text-xl font-extrabold">錯題筆記</h2>
            <p className="text-sm text-muted">{noteCount>0 ? `目前收藏 ${noteCount} 題，答對後可從筆記移除。` : '還沒有錯題。答錯的題目會自動收進來。'}</p>
          </div>
          <div className="flex gap-2">
            <Btn kind="ghost" onClick={openNotes}>查看筆記</Btn>
            <Btn onClick={practiceNotes} disabled={noteCount===0}>只重練錯題</Btn>
          </div>
        </div>
      </section>
    </div>
  );
}

function KeyPoints({onBack, start}) {
  return (
    <div className="pb-10 pt-6">
      <button onClick={onBack} className="mb-3 rounded-lg px-2 py-1 text-sm font-semibold text-muted hover:text-ink">← 回首頁</button>
      <div className="blueprint rounded-3xl border border-line p-6">
        <Chip className="bg-accentsoft text-accenttext">KEY POINTS</Chip>
        <h1 className="mt-2 font-display text-3xl font-extrabold">重點整理</h1>
        <p className="mt-1 text-muted">先把重點看過一遍，再到首頁挑戰各單元。</p>
      </div>
      <div className="nt mt-4" dangerouslySetInnerHTML={{__html: notesHTML()}}/>
      <h2 className="mt-8 font-display text-xl font-extrabold">看完重點，開始測驗</h2>
      <div className="mt-3 grid gap-3 sm:grid-cols-2">
        {ORDER.map(s => <Btn key={s} kind="ghost" className="!justify-start text-left" onClick={() => start({key:s, title:SEC[s].code + ' ' + SEC[s].en, secs:[s]})}>
          <Icon name={SEC[s].icon} size={30}/><span className="min-w-0 truncate">{SEC[s].code} {SEC[s].en}</span></Btn>)}
      </div>
    </div>
  );
}

function Notebook({notes, onBack, onRemove, onClear, onPractice}) {
  const ids = Object.keys(notes).filter(id => QBY[id]);
  const [confirmClear, setConfirmClear] = useState(false);
  return (
    <div className="pb-10 pt-6">
      <button onClick={onBack} className="mb-3 rounded-lg px-2 py-1 text-sm font-semibold text-muted hover:text-ink">← 回首頁</button>
      <div className="blueprint rounded-3xl border border-line p-6">
        <h1 className="font-display text-3xl font-extrabold">錯題筆記</h1>
        <p className="mt-1 text-muted">共 {ids.length} 題。先讀解析，再按「只重練錯題」。</p>
        <div className="mt-4 flex flex-wrap gap-2">
          <Btn onClick={onPractice} disabled={ids.length===0}>只重練錯題</Btn>
          {!confirmClear
            ? <Btn kind="ghost" onClick={() => setConfirmClear(true)} disabled={ids.length===0}>清空筆記</Btn>
            : <><Btn kind="ghost" onClick={() => setConfirmClear(false)}>取消</Btn><Btn className="!bg-bad" onClick={() => { onClear(); setConfirmClear(false); }}>確定清空</Btn></>}
        </div>
      </div>
      {ids.length===0 && <p className="mt-6 rounded-2xl border border-line bg-card p-5 text-muted">目前沒有錯題。去挑戰一個單元，答錯的題目會自動出現在這裡。</p>}
      {ORDER.map(s => {
        const list = QS[s].filter(q => notes[q.id]);
        if(!list.length) return null;
        return (
          <section key={s} className="mt-7">
            <h2 className="font-display text-lg font-extrabold">{SEC[s].code} <span className="text-base font-semibold text-muted">{SEC[s].zh}</span></h2>
            <div className="mt-3 flex flex-col gap-3">
              {list.map(q => <NoteCard key={q.id} q={q} sec={SEC[s]} yours={notes[q.id].last} count={notes[q.id].n} onRemove={() => onRemove(q.id)}/>)}
            </div>
          </section>
        );
      })}
    </div>
  );
}

function App() {
  const [view, setView] = useState('home');
  const [session, setSession] = useState(null);
  const [notes, setNotes] = useState(() => load(CFG.lsNotes, {}));
  const [best, setBest] = useState(() => load(CFG.lsBest, {}));
  useEffect(() => { save(CFG.lsNotes, notes); }, [notes]);
  useEffect(() => { save(CFG.lsBest, best); }, [best]);

  const begin = (cfg) => {
    const run = (n) => {
      const parts = cfg.secs.map(s => ({ sec:SEC[s], qs: (cfg.only ? QS[s].filter(q => cfg.only[q.id]) : QS[s]).map(shuffleQ) })).filter(p => p.qs.length);
      setSession({ ...cfg, parts, runId:n, retry: () => run(n+1) });
    };
    run(1); setView('quiz');
  };
  const start = (cfg) => begin({ mode:'unit', ...cfg });
  const practiceNotes = () => begin({ key:'notes', title:'錯題重練', mode:'notes', secs:ORDER, only:notes });

  const onRecord = (q, status, yours) => {
    if(status !== 'right') setNotes(n => ({...n, [q.id]: { n:((n[q.id]&&n[q.id].n)||0)+1, last:yours, at:Date.now() }}));
    else if(session && session.mode==='notes') setNotes(n => { const c={...n}; delete c[q.id]; return c; });
  };
  const onFinish = (key, score, total) => {
    if(key==='notes') return;
    setBest(b => (!b[key] || score/total > b[key].score/b[key].total) ? {...b, [key]:{score,total}} : b);
  };
  const removeNote = id => setNotes(n => { const c={...n}; delete c[id]; return c; });
  const count = Object.keys(notes).filter(id => QBY[id]).length;

  if(view==='quiz' && session) return <Quiz key={session.runId + session.key} session={session} onHome={() => setView('home')} onRecord={onRecord} onFinish={onFinish} onNotes={() => setView('notes')}/>;
  if(view==='notes') return <Notebook notes={notes} onBack={() => setView('home')} onRemove={removeNote} onClear={() => setNotes({})} onPractice={practiceNotes}/>;
  if(view==='key') return <KeyPoints onBack={() => setView('home')} start={start}/>;
  return <Home best={best} noteCount={count} start={start} openNotes={() => setView('notes')} practiceNotes={practiceNotes} openKey={() => setView('key')}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
